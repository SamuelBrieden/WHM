# =============================================================================
# WHM (Web-Halo Model) conda environment — full pinned spec.
#
# Verified-working architecture: NATIVE arm64 (osx-arm64), miniforge.
#   Captured 2026-06-02 on macOS 14.6.1 (Apple Silicon), Python 3.11.15.
#   TensorFlow 2.21.0 + baccoemu 2.3.0 import natively on arm64 — no Rosetta
#   fallback was needed.
#
# Recreate:   conda env create -f environment.yml      # creates env "whm"
#   then build the LOCAL CAMB (see pip section note) — or just run
#   setup_whm_env.sh, which does everything including the GATE and CAMB build.
#
# WORKAROUND captured here: setuptools is pinned to <81 (80.10.2). setuptools
# 81+ removed pkg_resources, which WHM-CAMB/camb/_compilers.py imports at build
# time; the local CAMB build fails without this pin. Build CAMB with
# --no-build-isolation so this pinned setuptools is the one setup.py sees.
#
# classy (CLASS) is intentionally ABSENT — built in a separate hand-off
# (class_public).
# =============================================================================
